name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - run: chmod +x gradlew
    - run: ./gradlew :app:assembleDebug --stacktrace
    - uses: actions/upload-artifact@v4
      with:
        name: 我的番茄-apk
        path: app/build/outputs/apk/debug/*.apk
